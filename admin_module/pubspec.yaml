name: admin_module
description: "Admin module for car wash"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  web_socket_channel: ^2.4.0
  share_plus: ^10.0.2
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/admin_icon.png"
  adaptive_icon_background: "#2D89D9"
  adaptive_icon_foreground: "assets/images/admin_icon.png"
  min_sdk_android: 21